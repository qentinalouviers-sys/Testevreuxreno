name = "lerat-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Modèle Gemini utilisé par le proxy. gemini-2.0-flash est rapide, multimodal
# (gère les captures d'écran) et disponible en palier gratuit. Tu peux mettre
# gemini-2.5-flash / gemini-1.5-pro selon ton accès.
[vars]
MODEL = "gemini-2.0-flash"
# ALLOW_ORIGIN = "https://<owner>.github.io"

# La clé API ne se met PAS ici. Utilise :
#   wrangler secret put GEMINI_API_KEY
